stages:
  - test
  - build
  - deploy
  - rollback

variables:
  MYSQL_DATABASE: tiket_lomba
  MYSQL_ROOT_PASSWORD: root
  MYSQL_USER: tiket_user
  MYSQL_PASSWORD: secret

cache:
  paths:
    - vendor/
    - node_modules/

phpunit:
  stage: test
  image: php:8.2-cli
  services:
    - mysql:8.0
  before_script:
    - apt-get update && apt-get install -y libpng-dev libonig-dev libxml2-dev zip unzip git
    - docker-php-ext-install pdo_mysql mbstring exif pcntl bcmath gd
    - pecl install xdebug && docker-php-ext-enable xdebug
  script:
    - cp .env.example .env
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --prefer-dist --no-progress
    - php artisan key:generate
    - php artisan migrate --force
    - php artisan db:seed --class=PermissionSeeder --force
    - php artisan db:seed --class=RolePermissionSeeder --force
    - php artisan test --coverage-text --colors=never
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  only:
    - merge_requests
    - main
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build_assets:
  stage: build
  image: node:18
  script:
    - npm ci
    - npm run prod
  artifacts:
    paths:
      - public/js/
      - public/css/
      - public/mix-manifest.json
    expire_in: 1 week
  only:
    - main

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache rsync openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - echo "=== DEPLOYMENT STARTED AT $(date) ==="
    - echo "Creating backup on server..."
    - ssh $SSH_USER@$SSH_HOST "mkdir -p $BACKUP_PATH && cp -r $DEPLOY_PATH $BACKUP_PATH/backup_$(date +%Y%m%d_%H%M%S) 2>/dev/null || true"
    - echo "Syncing files to server..."
    - rsync -avz --delete
      --exclude='.env'
      --exclude='.env.local'
      --exclude='.env.*.local'
      --exclude='storage/'
      --exclude='node_modules/'
      --exclude='vendor/'
      --exclude='.git/'
      --exclude='.github/'
      --exclude='.gitlab/'
      --exclude='tests/'
      --exclude='phpunit.xml'
      --exclude='.phpunit.result.cache'
      --exclude='*.md'
      --exclude='*.log'
      ./ $SSH_USER@$SSH_HOST:$DEPLOY_PATH
    - echo "Running post-deploy commands..."
    - ssh $SSH_USER@$SSH_HOST "cd $DEPLOY_PATH &&
      composer install --no-dev --optimize-autoloader --no-interaction &&
      php artisan migrate --force &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache &&
      php artisan storage:link 2>/dev/null || true &&
      chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || true &&
      chmod -R 775 storage bootstrap/cache 2>/dev/null || true"
    - echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ==="
  dependencies:
    - build_assets
  when: manual
  only:
    - main
  environment:
    name: production
    url: $APP_URL

rollback_production:
  stage: rollback
  image: alpine:latest
  before_script:
    - apk add --no-cache rsync openssh-client bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - echo "=== ROLLBACK STARTED ==="
    - echo "Available backups:"
    - ssh $SSH_USER@$SSH_HOST "ls -lt $BACKUP_PATH/ | head -10"
    - LATEST_BACKUP=$(ssh $SSH_USER@$SSH_HOST "ls -t $BACKUP_PATH/ | head -1")
    - |
      if [ -z "$LATEST_BACKUP" ]; then
        echo "Error: No backup found!"
        exit 1
      fi
    - echo "Rolling back to: $LATEST_BACKUP"
    - ssh $SSH_USER@$SSH_HOST "rm -rf $DEPLOY_PATH &&
      cp -r $BACKUP_PATH/$LATEST_BACKUP $DEPLOY_PATH &&
      cd $DEPLOY_PATH &&
      php artisan migrate --force &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache"
    - echo "=== ROLLBACK COMPLETED SUCCESSFULLY ==="
  when: manual
  only:
    - main
