version: '3.8'

services:
  # PHP-FPM Application Server
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: tiketlomba_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor_volume:/var/www/html/vendor
      - node_volume:/var/www/html/node_modules
      - storage_volume:/var/www/html/storage
      - bootstrap_cache_volume:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-tiketlomba}
      - DB_USERNAME=${DB_USERNAME:-tiket_user}
      - DB_PASSWORD=${DB_PASSWORD:-tiket_password}
      - SESSION_DRIVER=file
      - SANCTUM_STATEFUL_DOMAINS=localhost:8080,127.0.0.1:8080
      - LOG_CHANNEL=stderr
    depends_on:
      db:
        condition: service_healthy

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: tiketlomba_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_volume:/var/www/html/storage
      - bootstrap_cache_volume:/var/www/html/bootstrap/cache
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: tiketlomba_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tiketlomba}
      MYSQL_USER: ${DB_USERNAME:-tiket_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tiket_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Node.js for Asset Building (optional profile)
  node:
    image: node:18-alpine
    container_name: tiketlomba_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_volume:/var/www/html/node_modules
    profiles:
      - assets
    command: sh -c "npm ci && npm run dev"

volumes:
  db_data:
  vendor_volume:
  node_volume:
  storage_volume:
  bootstrap_cache_volume:

networks:
  default:
    name: tiketlomba_network